services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Initialize the demo environment first}
      POSTGRES_USER: ${POSTGRES_USER:?Initialize the demo environment first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialize the demo environment first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55440}:5432"
    volumes:
      - analytics_demo_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  analytics_demo_data:
