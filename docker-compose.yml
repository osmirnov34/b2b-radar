services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-b2b_radar}
      POSTGRES_USER: ${POSTGRES_USER:-b2b_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b_radar}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: pgvector/pgvector:pg18
    profiles:
      - test
    environment:
      POSTGRES_DB: b2b_radar_test
      POSTGRES_USER: b2b_radar_test
      POSTGRES_PASSWORD: b2b_radar_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U b2b_radar_test -d b2b_radar_test" ]
      interval: 2s
      timeout: 5s
      retries: 15
  app:
    build: .
    container_name: b2b-radar
    profiles:
      - cli
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    stdin_open: true
    tty: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: .
    container_name: b2b-radar-web
    command: uvicorn src.web.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: b2b-radar-caddy
    profiles:
      - prod
    env_file:
      - .env
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
