[project]
name = "b2b-radar"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
    "google-api-python-client",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "python-dotenv>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "lingua-language-detector>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pre-commit",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff",
    "mypy",
]
# Offline pain-mining analysis (embeddings + topic clustering). Heavy ML stack
analysis = [
    "bertopic>=0.16",
    "hnswlib>=0.8.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "stopwordsiso>=0.6.1",
    "umap-learn>=0.5.7",
]

[tool.ruff]
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "build",
    "dist",
    "migrations",
    "scripts",
]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D205",
    "FBT001", "FBT002",
    "ERA001"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401", "PLR2004", "RUF001", "S101", "SLF001"]
"src/infrastructure/db/repositories.py" = ["PLR0913"]
"src/ml/inspection.py" = ["C901", "PLR0912", "PLR0915"]
"src/ml/eda.py" = ["C901", "PLR0912", "PLR0915"]
"src/ml/cleaning.py" = ["C901", "PLR0911"]
"src/ml/semantic_deduplication.py" = ["C901", "PLC0415", "PLR0913"]
"src/ml/embeddings.py" = ["C901", "PLC0415", "PLR0912", "PLR0913", "PLR0915"]
"src/ml/corpus.py" = ["C901", "PLC0415", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]
"src/ml/dimensionality_reduction.py" = ["C901", "PLC0415", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "S403"]
"src/web/routers/*" = ["PLR0913", "PLR0917"]

[tool.mypy]
strict = true
python_version = "3.12"

exclude = [
    'venv',
    '.venv',
    'tests',
    'migrations',
    'scripts',
]

warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires the dedicated PostgreSQL test database"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]
